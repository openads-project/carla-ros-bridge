include:
  - project: fb-fi/ops/docker-ros
    ref: feature/docker-compose-variable
    file: templates/.gitlab-ci.template.yml

variables:
  DISABLE_ARCH_ARM64: 'true'
  DOCKER_COMPOSE_FILE: docker-compose-ros1.yml

.test:
  variables:
    DOCKER_RUN_OPTS: -u root:root -e SCENARIO_RUNNER_PATH='.' # industrial_ci tests launch files which require this env var to at least be set