<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aIn" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5555FF"/></marker>
    <marker id="aEg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6.5,3 L0,6 Z" fill="#FFAA00"/></marker>
    <marker id="aCon" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6.5,3 L0,6 Z" fill="#0E8A9C"/></marker>
  </defs>

  <rect x="1" y="1" width="778" height="558" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2328">ETSI ITS MAPEM/SPATEM</text>

  <!-- roads -->
  <rect x="40" y="250" width="700" height="110" fill="#E9ECEF"/>
  <rect x="345" y="80" width="110" height="400" fill="#E9ECEF"/>
  <!-- junction box (conflict area) -->
  <rect x="345" y="250" width="110" height="110" fill="#DEE2E6"/>
  <rect x="345" y="250" width="110" height="110" fill="none" stroke="#AEB6BF" stroke-dasharray="4 4"/>

  <!-- lane dividers -->
  <line x1="40" y1="305" x2="345" y2="305" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="455" y1="305" x2="740" y2="305" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="400" y1="80" x2="400" y2="250" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="400" y1="360" x2="400" y2="480" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- INGRESS lanes (blue, pointing into the junction) -->
  <line x1="55"  y1="332" x2="338" y2="332" stroke="#5555FF" stroke-width="3" marker-end="url(#aIn)"/>
  <line x1="725" y1="278" x2="462" y2="278" stroke="#5555FF" stroke-width="3" marker-end="url(#aIn)"/>
  <line x1="373" y1="95"  x2="373" y2="238" stroke="#5555FF" stroke-width="3" marker-end="url(#aIn)"/>
  <line x1="427" y1="465" x2="427" y2="372" stroke="#5555FF" stroke-width="3" marker-end="url(#aIn)"/>

  <!-- EGRESS lanes (orange, pointing out of the junction) -->
  <line x1="338" y1="278" x2="55"  y2="278" stroke="#FFAA00" stroke-width="3" marker-end="url(#aEg)"/>
  <line x1="462" y1="332" x2="725" y2="332" stroke="#FFAA00" stroke-width="3" marker-end="url(#aEg)"/>
  <line x1="427" y1="245" x2="427" y2="95"  stroke="#FFAA00" stroke-width="3" marker-end="url(#aEg)"/>
  <line x1="373" y1="372" x2="373" y2="465" stroke="#FFAA00" stroke-width="3" marker-end="url(#aEg)"/>

  <text x="100" y="350" font-size="13" fill="#1F2328" font-weight="600">ingress lane</text>
  <text x="100" y="270" font-size="13" fill="#1F2328" font-weight="600">egress lane</text>

  <!-- stop line -->
  <line x1="343" y1="307" x2="343" y2="358" stroke="#FFFFFF" stroke-width="5"/>

  <!-- connection: ingress -> egress, carrying the signal group -->
  <path d="M343,332 C 392,322 418,300 427,250" fill="none" stroke="#0E8A9C" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#aCon)"/>
  <line x1="467" y1="212" x2="431" y2="251" stroke="#0E8A9C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="470" y="208" font-size="13" fill="#0B6E7C" font-weight="600">connection</text>

  <!-- reference point -->
  <circle cx="400" cy="305" r="9" fill="#FFFFFF" stroke="#6E40C9" stroke-width="2.5"/>
  <line x1="400" y1="297" x2="400" y2="313" stroke="#6E40C9" stroke-width="2.5"/>
  <line x1="392" y1="305" x2="408" y2="305" stroke="#6E40C9" stroke-width="2.5"/>

  <!-- traffic light controlling the ingress lane -->
  <line x1="307" y1="404" x2="335" y2="338" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="291" y="392" width="18" height="44" rx="4" fill="#1F2328"/>
  <circle cx="300" cy="402" r="5" fill="#F85149"/>
  <circle cx="300" cy="414" r="5" fill="#3A3F45"/>
  <circle cx="300" cy="426" r="5" fill="#3FB950"/>
  <text x="285" y="409" text-anchor="end" font-size="13" fill="#1F2328" font-weight="600">signal group ID =</text>
  <text x="285" y="425" text-anchor="end" font-size="13" fill="#1F2328" font-weight="600">traffic light ID</text>

  <!-- legend -->
  <rect x="40" y="498" width="700" height="50" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
  <line x1="55" y1="516" x2="78" y2="516" stroke="#5555FF" stroke-width="3" marker-end="url(#aIn)"/>
  <text x="86" y="520" font-size="12" fill="#1F2328">ingress lane (enters junction)</text>
  <line x1="400" y1="516" x2="423" y2="516" stroke="#FFAA00" stroke-width="3" marker-end="url(#aEg)"/>
  <text x="431" y="520" font-size="12" fill="#1F2328">egress lane (exits junction)</text>
  <line x1="55" y1="536" x2="80" y2="536" stroke="#0E8A9C" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#aCon)"/>
  <text x="88" y="540" font-size="12" fill="#1F2328">connection (ingress → egress)</text>
  <circle cx="406" cy="536" r="6" fill="#FFFFFF" stroke="#6E40C9" stroke-width="2"/>
  <line x1="406" y1="530" x2="406" y2="542" stroke="#6E40C9" stroke-width="2"/>
  <line x1="400" y1="536" x2="412" y2="536" stroke="#6E40C9" stroke-width="2"/>
  <text x="420" y="540" font-size="12" fill="#1F2328">reference point (WGS84)</text>
</svg>
